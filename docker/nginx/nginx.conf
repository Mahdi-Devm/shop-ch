worker_processes auto;

events {
  worker_connections 4096;
}

http {
  log_format without_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log without_query;

  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream order_api {
    zone order_api 64k;
    server order:3001 resolve;
    keepalive 64;
  }

  upstream web_app {
    zone web_app 64k;
    server web:3000 resolve;
    keepalive 16;
  }

  server {
    listen 80;
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/orders/[^/]+/events$ {
      proxy_pass http://order_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass http://order_api;
    }

    location /auth/ {
      proxy_pass http://order_api;
    }

    location = /health {
      proxy_pass http://order_api;
    }

    location / {
      proxy_pass http://web_app;
    }
  }
}
